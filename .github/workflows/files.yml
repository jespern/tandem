name: File end-to-end

on:
  push:
    paths: ['interop/**', 'sdk/go/**', 'conformance/stalwart.py', 'conformance/mail_transport.py', '.github/workflows/files.yml']
  pull_request:
    paths: ['interop/**', 'sdk/go/**', 'conformance/stalwart.py', 'conformance/mail_transport.py', '.github/workflows/files.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stalwart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - run: python -B -W error::ResourceWarning -m unittest discover -s interop -q
      - run: python -B interop/interop.py go --files --race --report .build/file-e2e.json
      - run: python -B interop/interop.py go --wire --race --report .build/file-wire.json
      - run: python -B interop/campaign.py go --seeds 8 9 --steps 12 --race --report .build/file-history.json
      - name: Record scenario results
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Scenario | Result | Seconds |\n|---|---|---|\n')
              for name in ('file-e2e.json', 'file-wire.json', 'file-history.json'):
                  report = Path('.build') / name
                  if report.exists():
                      for row in json.loads(report.read_text())['results']:
                          summary.write(f"| {row['scenario']} | {'pass' if row['ok'] else 'FAIL'} | {row['seconds']} |\n")
          PY
