name: SDK interoperability

on:
  push:
    paths: ['sdk/**', 'vectors/v2/**', 'Package.swift', '.github/workflows/sdks.yml']
  pull_request:
    paths: ['sdk/**', 'vectors/v2/**', 'Package.swift', '.github/workflows/sdks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: python -m pip install -e sdk/python
      - run: npm --prefix sdk/typescript ci --ignore-scripts
      - run: python -B sdk/check.py
