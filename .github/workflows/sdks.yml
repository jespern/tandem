name: SDK interoperability

on:
  push:
    paths: ['sdk/**', 'vectors/v2/**', 'conformance/stalwart.py', 'conformance/mail_transport.py', 'Package.swift', '.github/workflows/sdks.yml']
  pull_request:
    paths: ['sdk/**', 'vectors/v2/**', 'conformance/stalwart.py', 'conformance/mail_transport.py', 'Package.swift', '.github/workflows/sdks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    # Swift 6.4 ships with Xcode 27, which GitHub offers as the xcode-27 image (public preview).
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # Package.swift needs Swift tools 6.4; the runner's default Xcode can be older.
      - name: Select an Xcode with Swift 6.4 or later
        run: |
          for x in $(ls -d /Applications/Xcode*.app | sort -rV); do
            if DEVELOPER_DIR="$x/Contents/Developer" xcrun swift --version 2>/dev/null | grep -Eq 'Swift version 6\.([4-9]|[1-9][0-9])'; then
              sudo xcode-select -s "$x"
              swift --version
              exit 0
            fi
          done
          echo "No Xcode with Swift 6.4 or later on this runner:"
          ls -d /Applications/Xcode*.app
          exit 1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: python -m pip install -e sdk/python
      - run: npm --prefix sdk/typescript ci --ignore-scripts
      - run: python -B sdk/check.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - run: npm --prefix sdk/typescript ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: sdk/typescript
      - run: python -B sdk/check_browser.py
