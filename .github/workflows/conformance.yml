name: Protocol conformance

on:
  push:
    paths:
      - 'conformance/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    paths:
      - 'conformance/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: --require-cryptokit --require-libsodium
          - os: ubuntu-latest
            flags: --mail --require-libsodium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - if: runner.os == 'macOS'
        run: brew install libsodium
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libsodium23
      - run: python -m pip install -r conformance/requirements.txt
      - run: python -B -W error::ResourceWarning conformance/run.py ${{ matrix.flags }}
