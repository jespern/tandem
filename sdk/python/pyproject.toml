[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-protocol"
version = "0.2.0.dev0"
description = "Tandem v2 protocol core"
requires-python = ">=3.15"
dependencies = ["cryptography==50.0.2"]

[tool.setuptools.packages.find]
include = ["tandem*"]
